<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">📚 Moru Library</div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="search.html">Search Catalog</a></li>
                <li><a href="feedback.html" class="active">Feedback</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <button class="btn-secondary">Sign In</button>
        </div>
    </header>

    <!-- Feedback Page Header -->
    <section class="feedback-header">
        <h1>We Value Your Feedback</h1>
        <p>Help us improve our library collection, digital resources, and services.</p>
    </section>

    <!-- Feedback Form Container -->
    <main class="feedback-container">
        <div class="feedback-card">
            <form id="feedbackForm">
                
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your name..." required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="topic">Feedback Topic</label>
                    <select id="topic" required>
                        <option value="" disabled selected>Select a topic...</option>
                        <option value="book-request">Book Suggestion / Request</option>
                        <option value="website-bug">Website Issue / Bug</option>
                        <option value="general-inquiry">General Inquiry</option>
                        <option value="compliment">Compliment / Praise</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" rows="5" placeholder="Tell us how we can help or what books you'd like to see..." required></textarea>
                </div>

                <button type="submit" class="btn-primary submit-btn">Submit Feedback</button>
            </form>

            <!-- Success Alert Banner (Hidden by default) -->
            <div id="successMessage" class="success-banner hidden">
                <h3>Thank you! 🎉</h3>
                <p>Your feedback has been successfully submitted. We appreciate your input!</p>
                <button class="btn-secondary reset-btn" id="sendAnotherBtn">Send Another Response</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Moru Library Hub. All rights reserved.</p>
    </footer>

    <script src="feedback.js"></script>
    
</body>
</html>
