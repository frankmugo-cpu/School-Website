<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E & F Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>  


    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">📚 Moru Library</div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="search.html" class="active">Search Catalog</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <button class="btn-secondary">Sign In</button>
        </div>
    </header>

    <!-- Search Page Header -->
    <section class="search-header">
        <h1>Advanced Book Search</h1>
        <p>Find books by title, author, category, or availability status.</p>
        
        <!--Book Form -->
        <form id="bookform" class="form-container">
            <input type="text" id="title" placeholder="Book Title" required>
            <input type="text" id="author" placeholder="Author Name" required>

            <select id="inputstatus">
                <option value="Unread">Unread</option>
                <option value="Read">Read</option>
            </select>

            <div class="button-group">
                <button type="submit" id="addBookBtn">Add Book</button>
                <!--Form Clear Button (See issue explanation below)-->
                <button type="button" id="clearBtn" class="btn-clear">Clear Form</button>
            </div>

        <!--search & Stats Bar-->
        <div class="catalog-header">
            <input type="text" id="searchInput" placeholder="Search catalog...">
            <p id="counter">Total Books: <span id="bookCount">0</span></p>
        </div>

        <!--Empty state message-->
        <p id="emptyMessage" class="empty-message">No books in the library.</p>

        <!--Book Shelf Display-->
        <div class="library-shelf" id="shelfDisplay">
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Moru Library Hub. All rights reserved.</p>
    </footer>

    <script src="search.js"></script>

</body>
</html>
